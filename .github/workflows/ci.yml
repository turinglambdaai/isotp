name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep all Windows, macOS and Linux tests and documentation checks.
# Only superseded CI runs for the same PR/branch are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          version: 'stable'
      - name: Install package
        run: raco pkg install --auto --link "$(pwd)"
      - name: Run tests
        run: raco test -p isotp
      - name: Run transport-free documented quickstart
        run: racket examples/quickstart.rkt
      - name: Build Scribble API and verify dependencies
        run: raco setup --check-pkg-deps -l isotp
